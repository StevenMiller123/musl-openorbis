name: Create Stable Release

on: [ push, pull_request ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up environment
      run: |
        mkdir ps4
    - name: Configure
      run: ./configure --target=x86_64-scei-ps4 --disable-shared CC="clang" CFLAGS="-fPIC -DPS4 -D_LIBUNWIND_IS_BAREMETAL=1" --prefix=./ps4

    - name: Build
      run: make

    - name: Install
      run: make install
    
    - name: Create tarball
      run: |
        cd ps4
        tar -cvzf musl.tar.gz lib/* include/*

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions
      with:
        tag_name: release-${{ GITHUB.SHA }}
        release_name: Automated Release ${{ GITHUB.SHA }}
        body: |
          Automated build.
        draft: false
        prerelease: false

    - name: Upload Release Asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ps4/musl.tar.gz
        asset_name: musl.tar.gz
        asset_content_type: application/gzip
